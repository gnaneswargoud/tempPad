<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempPad — Error</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main>
        <div class="error-container">
            <div class="error-icon">🚫</div>
            <h1>Invalid Filename</h1>
            <p>
                The filename in the URL is not valid. Filenames can only contain
                letters, numbers, hyphens, and underscores (1–64 characters, no spaces or dots).
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Create a file</a>
            </div>
        </div>
    </main>

    <script src="/js/theme.js"></script>
</body>
</html>
