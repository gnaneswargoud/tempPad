services:
  # TempPad Web Service (Express Node.js application)
  - type: web
    name: Notepad
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: temppad-db
          property: connectionString

databases:
  # Managed PostgreSQL instance (Free Tier)
  - name: temppad-db
    plan: free
    databaseName: temppad
    user: temppad_user
